name: Traycer SSH Windows

on:
  workflow_dispatch:
  push:
    branches: [codex/ssh-desktop]

permissions:
  contents: read

concurrency:
  group: traycer-ssh-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Linux watchdog regression tests
        run: python3 -m unittest discover -s scripts/ssh-host-watchdog -v

  windows:
    needs: watchdog
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - name: SSH transport tests
        working-directory: clients/desktop
        run: >-
          bun x vitest run
          src/electron-main/ssh/__tests__
          src/electron-main/app/__tests__/logger-sanitizing-hook.test.ts
          src/electron-main/windows/__tests__/window-factory.test.ts
          src/electron-main/browser-sessions/__tests__/browser-sessions-transport.test.ts
          src/electron-main/browser-sessions/__tests__/browser-sessions-owner.test.ts
          src/electron-main/browser-sessions/__tests__/browser-sessions-host-directory.test.ts
          --maxWorkers=2
      - name: Shared remote session lifecycle tests
        working-directory: clients/shared
        run: >-
          bun x vitest run
          host-transport/remote/__tests__/remote-stream-client.test.ts
          host-transport/remote/__tests__/create-remote-transport.test.ts
          host-transport/remote/__tests__/active-remote-sessions.test.ts
          host-transport/remote/__tests__/active-remote-sessions-readiness-events.test.ts
          host-transport/remote/__tests__/active-remote-sessions-borrow.test.ts
          host-transport/remote/__tests__/remote-session.test.ts
          host-transport/__tests__/chat-stream-client.test.ts
          --maxWorkers=2
      - name: Durable route and session lifecycle tests
        working-directory: clients/gui-app
        run: >-
          bun x vitest run
          src/lib/host/__tests__/durable-stream-transport.test.ts
          src/lib/host/__tests__/use-durable-stream-transport.test.ts
          src/lib/host/__tests__/durable-stream-warm-route-change.test.ts
          src/lib/registries/__tests__/chat-session-registry.test.tsx
          src/lib/registries/__tests__/terminal-session-registry.test.tsx
          src/lib/host/__tests__/owned-durable-stream-client.test.ts
          src/lib/host/__tests__/plan-restricted-session-rebuild-backoff.test.ts
          src/stores/chats/__tests__/chat-session-store-lifecycle-close.test.ts
          --maxWorkers=2
      - name: Build independent installer
        working-directory: clients/desktop
        env:
          TRAYCER_SSH_VERSION: 0.1.0-ssh.${{ github.run_number }}
          VITE_DESKTOP_LOCAL_STORAGE_KEY: ${{ secrets.TRAYCER_SSH_STORAGE_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:ssh
      - uses: actions/upload-artifact@v4
        with:
          name: Traycer-SSH-Windows-x64
          path: clients/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
